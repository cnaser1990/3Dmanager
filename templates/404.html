<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - اسپاگتی شد! | پرینت‌کست</title>
    <!-- FontAwesome CDN (So icons work even if local static fails) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f3f4f6;
            --text: #1f2937;
            --font: 'Tahoma', sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font);
            background: radial-gradient(circle at center, #fff 0%, #e0e7ff 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--text);
        }

        .container {
            position: relative;
            text-align: center;
            z-index: 10;
        }

        /* Glitch Text */
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            color: var(--primary);
            position: relative;
            margin: 0;
            line-height: 1;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        }

        /* Nozzle Animation */
        .nozzle-wrapper {
            margin-bottom: 20px;
            animation: shake 3s infinite ease-in-out;
        }
        .nozzle-head {
            width: 50px; height: 40px; background: #374151; margin: 0 auto; border-radius: 4px;
        }
        .nozzle-tip {
            width: 0; height: 0; 
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 20px solid #d4af37;
            margin: 0 auto;
        }
        .spaghetti {
            font-size: 4rem;
            color: var(--primary);
            margin-top: -15px;
            display: block;
            animation: spin 6s infinite linear;
            opacity: 0.8;
        }

        h2 { font-size: 2rem; margin: 10px 0; }
        p { color: #6b7280; margin-bottom: 30px; font-size: 1.1rem; }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 12px 24px; border-radius: 12px; text-decoration: none;
            font-weight: bold; transition: 0.3s; margin: 5px;
        }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.5); }
        .btn-outline { border: 2px solid #d1d5db; color: #4b5563; }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); background: white; }

        /* Terminal Style */
        .terminal {
            background: #111827; color: #10b981;
            padding: 20px; border-radius: 12px;
            font-family: monospace; text-align: left; direction: ltr;
            max-width: 400px; margin: 0 auto 30px auto;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.2);
        }
        .line { margin-bottom: 5px; opacity: 0; animation: type 0.5s forwards; }
        .line:nth-child(1) { animation-delay: 0.2s; }
        .line:nth-child(2) { animation-delay: 0.6s; }
        .line:nth-child(3) { animation-delay: 1.0s; color: #ef4444; }
        .cursor { animation: blink 1s infinite; }

        /* Floating Background */
        .bg-icon {
            position: absolute; color: var(--primary); opacity: 0.05;
            font-size: 5rem; animation: float 10s infinite linear;
        }

        @keyframes shake { 0%, 100% {transform:translateX(0);} 50% {transform:translateX(5px);} }
        @keyframes spin { 0% {transform:rotate(0deg) scale(1);} 50% {transform:rotate(180deg) scale(1.2);} 100% {transform:rotate(360deg) scale(1);} }
        @keyframes type { to {opacity: 1;} }
        @keyframes blink { 50% {opacity: 0;} }
        @keyframes float { 0% {transform: translateY(0) rotate(0deg);} 100% {transform: translateY(-50px) rotate(20deg);} }
    </style>
</head>
<body>

    <!-- Floating Background -->
    <i class="fas fa-cube bg-icon" style="top:10%; left:10%"></i>
    <i class="fas fa-layer-group bg-icon" style="bottom:10%; right:10%; animation-delay: -2s"></i>
    <i class="fas fa-cog bg-icon" style="top:20%; right:20%; animation-delay: -5s"></i>

    <div class="container">
        <div class="nozzle-wrapper">
            <div class="nozzle-head"></div>
            <div class="nozzle-tip"></div>
            <i class="fas fa-wind spaghetti"></i>
        </div>

        <h1 class="error-code">404</h1>
        <h2>پرینت ناموفق بود!</h2>
        <p>لایه مورد نظر پیدا نشد (Page Not Found).<br>ممکن است مدل پاک شده باشد یا آدرس اشتباه باشد.</p>

        <div class="terminal">
            <div class="line">> G28 X0 Y0 ; Home</div>
            <div class="line">> M104 S200 ; Heat Nozzle</div>
            <div class="line">> Error: 404 Layer Missing</div>
            <div class="line">> _<span class="cursor">_</span></div>
        </div>

        <div>
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home"></i>
                صفحه اصلی
            </a>
            <a href="javascript:history.back()" class="btn btn-outline">
                <i class="fas fa-undo"></i>
                بازگشت
            </a>
        </div>
    </div>

</body>
</html>
