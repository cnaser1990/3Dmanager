<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - خطای سیستم | پرینت‌کست</title>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --danger: #ef4444;
            --dark: #1a0505;
            --text: #ffffff;
            --font: 'Tahoma', sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font);
            background: linear-gradient(135deg, #1a0505 0%, #450a0a 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--text);
        }

        /* Scanline Effect */
        body::after {
            content: ''; position: fixed; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 99;
        }

        .alert-box {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--danger);
            border-radius: 16px;
            padding: 0;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.4);
            text-align: center;
            backdrop-filter: blur(10px);
            animation: pulseBox 2s infinite;
        }

        .header {
            background: var(--danger);
            color: white;
            padding: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .led {
            width: 12px; height: 12px; background: #500000; border-radius: 50%;
        }
        .led.on { background: #ff9999; box-shadow: 0 0 10px #fff; animation: blink 0.5s infinite; }

        .content { padding: 40px 30px; }

        .icon-wrapper {
            font-size: 4rem; margin-bottom: 20px; color: var(--danger);
            animation: shake 0.5s infinite;
        }

        h1 { margin: 0; font-size: 4rem; line-height: 1; }
        h3 { margin: 10px 0 20px 0; color: #fca5a5; }
        p { color: #d1d5db; margin-bottom: 30px; line-height: 1.6; }

        .stats {
            display: flex; justify-content: center; gap: 20px; margin-bottom: 30px;
            background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px;
        }
        .stat { display: flex; flex-direction: column; }
        .stat-label { font-size: 0.8rem; opacity: 0.7; }
        .stat-val { font-weight: bold; font-family: monospace; font-size: 1.2rem; }

        .btn {
            display: inline-block; padding: 12px 30px; background: var(--danger);
            color: white; text-decoration: none; border-radius: 8px;
            font-weight: bold; transition: 0.3s; box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }
        .btn:hover { background: #dc2626; box-shadow: 0 0 40px rgba(239, 68, 68, 0.8); }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes pulseBox { 0%, 100% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.3); } 50% { box-shadow: 0 0 50px rgba(239, 68, 68, 0.6); } }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
    </style>
</head>
<body>

    <div class="alert-box">
        <div class="header">
            <div class="led on"></div>
            <span>M112 EMERGENCY STOP</span>
            <div class="led on"></div>
        </div>
        <div class="content">
            <div class="icon-wrapper">
                <i class="fas fa-temperature-high"></i>
            </div>
            <h1>500</h1>
            <h3>THERMAL RUNAWAY (خطای سرور)</h3>
            <p>
                سرور به دلیل اتمام فیلامنت متوقف شد! 
                <br>
                تیم فنی در حال تعویض فیلامنت هستند! با آن ها تماس بگیرید.
            </p>

            <div class="stats">
                <div class="stat">
                    <span class="stat-label">NOZZLE</span>
                    <span class="stat-val" style="color: #fca5a5;">ERR</span>
                </div>
                <div class="stat">
                    <span class="stat-label">BED</span>
                    <span class="stat-val">60°C</span>
                </div>
                <div class="stat">
                    <span class="stat-label">FAN</span>
                    <span class="stat-val">100%</span>
                </div>
            </div>

            <a href="/" class="btn">
                <i class="fas fa-power-off"></i>
                راه‌اندازی مجدد (Reset)
            </a>
        </div>
    </div>

</body>
</html>
